<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Paie SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h3 class="text-center fw-bold mb-4">Connexion</h3>

                        <!-- AFFICHAGE DES MESSAGES DJANGO (Succès d'inscription, d'activation, etc.) -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show p-2 small mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.7rem;"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        {% if form.errors %}
                            <div class="alert alert-danger alert-dismissible fade show p-2 small mb-3" role="alert">
                                Identifiant ou mot de passe incorrect.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Nom d'utilisateur</label>
                                <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Mot de passe</label>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Se connecter</button>
                        </form>

                        <hr class="my-4 text-muted">

                        <div class="text-center">
                            <p class="mb-1 text-muted small">Vous n'avez pas encore de compte ?</p>
                            <a href="{% url 'accounts:register' %}" class="btn btn-outline-success btn-sm w-100 fw-semibold">
                                + Créer un nouveau compte
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Script Bootstrap pour faire fonctionner la fermeture des alertes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
