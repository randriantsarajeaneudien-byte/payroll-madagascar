{% extends "base.html" %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card border-danger shadow">
        <div class="card-body text-center p-4">
            <h3 class="text-danger mb-3">Supprimer le salarié ?</h3>
            <p>Êtes-vous sûr de vouloir supprimer définitivement <strong>{{ employee.first_name }} {{ employee.last_name }}</strong> ?</p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Oui, supprimer</button>
                <a href="{% url 'payroll:dashboard' %}" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
